name: Release

# Verify a version tag and create the GitHub Release. pub.dev publishing is
# `.github/workflows/publish.yml` (OIDC, environment `pub.dev`) on the same
# `vX.Y.Z` tag — do not also run `dart pub publish` by hand.
#
# This is a library. There is no CLI binary matrix (unlike pqforge).
# Create the GitHub Release in one shot: do not publish an empty release and
# attach assets later (GitHub immutable releases lock assets after publish).
#
# The 12-way SLH-DSA ACVP matrix and the dart2js/dart2wasm jobs stay on CI
# (`ci.yml`). This workflow re-runs the core VM gates that must be green
# before a tag is cut.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Verify tag and create GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze source
        run: dart analyze

      - name: Verify Cookbook ships in the pub archive
        run: dart run tool/check_publish_surface.dart

      - name: Generate API docs
        run: dart doc --output /tmp/pqcrypto-doc

      - name: Run ordinary VM regression suite
        shell: bash
        run: |
          mapfile -d '' tests < <(
            find test -maxdepth 1 -name '*_test.dart' \
              ! -name 'kat_evaluator_test.dart' \
              ! -name 'mldsa_kat_test.dart' \
              ! -name 'slhdsa_kat_test.dart' \
              -print0 | sort -z
          )
          dart test --concurrency=1 "${tests[@]}"

      - name: Run ML-KEM KAT corpus
        run: dart test --concurrency=1 test/kat_evaluator_test.dart

      - name: Run ML-DSA KAT corpus
        run: dart test --concurrency=1 test/mldsa_kat_test.dart

      - name: Publish dry run
        run: dart pub publish --dry-run

      - name: Assert tag matches pubspec version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          ver="${tag#v}"
          pubspec_ver="$(python3 -c "import pathlib,re; t=pathlib.Path('pubspec.yaml').read_text(); print(re.search(r'^version:\s+(\S+)', t, re.M).group(1))")"
          test "$ver" = "$pubspec_ver"

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          make_latest: true
          body: |
            `pqcrypto` ${{ github.ref_name }}

            Verified by the release workflow:
            - `dart format`
            - `dart analyze`
            - `tool/check_publish_surface.dart`
            - `dart doc`
            - ordinary VM tests
            - ML-KEM KAT (`test/kat_evaluator_test.dart`)
            - ML-DSA KAT (`test/mldsa_kat_test.dart`)
            - `dart pub publish --dry-run`
            - tag matches `pubspec.yaml` version

            SLH-DSA ACVP (all 12 sets) and dart2js/dart2wasm stay on
            [CI](https://github.com/turkananation/pqcrypto/actions/workflows/ci.yml).

            pub.dev publishing is automatic via
            [`.github/workflows/publish.yml`](https://github.com/turkananation/pqcrypto/blob/develop/.github/workflows/publish.yml)
            (GitHub Actions OIDC, environment `pub.dev`) on `vX.Y.Z` tags.

            This is not a FIPS 140 module. See [doc/FIPS_140_BOUNDARY.md](https://github.com/turkananation/pqcrypto/blob/develop/doc/FIPS_140_BOUNDARY.md).
