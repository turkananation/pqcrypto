# Agents and codegen tools: read this first. An idea is only safe to emit WITH
# its you_supply and caveats. Never strip them. Never upgrade a claim past
# evidence_boundary.allowed_claims.
agent_contract:
  must_carry_into_output:
    - the selected idea's you_supply list
    - the selected idea's caveats list
    - each referenced building block's you_supply and caveats
  must_not:
    - emit any string in evidence_boundary.forbidden_claims
    - present ML-KEM alone as authenticated/secure transport
    - imply "quantum-safe" means "secure" or "private"
    - call pqcrypto FIPS-validated or certified
    - design against any idea whose status is not "available"

evidence_boundary:
  no_cmvp_fips_140_claim: true
  zeroization: best_effort_dart
  side_channel_posture: best_effort_dart
  allowed_claims:
    - "FIPS 203-aligned ML-KEM with checked-in KAT evidence."
    - "FIPS 204-aligned ML-DSA, byte-exact on the checked-in KAT corpus."
    - "OpenSSL interop A-G passes for ML-KEM-512/768/1024."
    - "Best-effort zeroization in Dart."
  forbidden_claims:
    - "FIPS validated"
    - "CMVP validated"
    - "certified"
    - "constant-time guarantee"
    - "memory is securely erased"
    - "ML-KEM is authenticated/secure transport on its own"
  key_facts:
    - "Package exports ONLY ML-KEM (PqcKem/KyberKem) and ML-DSA (MlDsa) plus DilithiumParams."
    - "HKDF, AEAD, X25519, public hashing, KMAC, secure storage are NOT provided; the app supplies them."
    - "ML-KEM yields a 32-byte shared secret; it is not encryption by itself (needs KDF + AEAD)."
    - "Public keys must be authenticated; a self-provided key is not an identity."
    - "Embedded means embedded Linux / SBC; bare-metal microcontrollers are out of scope."
    - "Flutter web does not offload isolates; heavy keygen blocks the main thread."
  universal_you_supply:
    - HKDF or another KDF
    - AEAD (AES-GCM or ChaCha20-Poly1305)
    - a public hash (e.g. SHA-256) for transcripts/logs
    - X25519 or another classical KEX for hybrid handshakes
    - secure key storage (platform keystore / KMS / HSM)
    - CSPRNG for nonces and salts

algorithms:
  ml_kem:
    sizes_bytes:
      ml-kem-512: {security_category: 1, public_key: 800, secret_key: 1632, ciphertext: 768, shared_secret: 32}
      ml-kem-768: {security_category: 3, public_key: 1184, secret_key: 2400, ciphertext: 1088, shared_secret: 32}
      ml-kem-1024: {security_category: 5, public_key: 1568, secret_key: 3168, ciphertext: 1568, shared_secret: 32}
    api:
      factory: "PqcKem.kyber512 | PqcKem.kyber768 | PqcKem.kyber1024"
      generate_key_pair: "generateKeyPair([Uint8List seed /* 32=d or 64=d||z */]) -> (pk, sk)"
      encapsulate: "encapsulate(pk, [nonce]) -> (ct, ss32)"
      decapsulate: "decapsulate(sk, ct) -> ss32"
  ml_dsa:
    sizes_bytes:
      ml-dsa-44: {security_category: 2, public_key: 1312, secret_key: 2560, signature: 2420}
      ml-dsa-65: {security_category: 3, public_key: 1952, secret_key: 4032, signature: 3309}
      ml-dsa-87: {security_category: 5, public_key: 2592, secret_key: 4896, signature: 4627}
    api:
      params: "DilithiumParams.mlDsa44 | mlDsa65 | mlDsa87"
      generate_key_pair: "MlDsa.generateKeyPair(params) -> (pk, sk)  /* hedged */"
      generate_key_pair_seeded: "MlDsa.generateKeyPairSeeded(params, seed32) -> (pk, sk)"
      sign: "MlDsa.sign(sk, m, params, {ctx<=255, rnd}) -> sig  /* hedged default */"
      sign_deterministic: "MlDsa.signDeterministic(sk, m, params, {ctx}) -> sig  /* discouraged */"
      hash_sign: "MlDsa.hashSign(sk, m, params, {ctx, rnd}) -> sig  /* pre-hash, large msgs */"
      verify: "MlDsa.verify(pk, m, sig, params, {ctx}) -> bool  /* never throws */"
      hash_verify: "MlDsa.hashVerify(pk, m, sig, params, {ctx}) -> bool"

building_blocks:
  - id: BB1
    name: Detached signatures
    anchor: doc/cookbook/BUILDING_BLOCKS.md#bb1-detached-signatures
    algos: [ml-dsa]
    you_supply: [canonical message encoding, public-key trust/distribution]
    caveats:
      - "A signature is only meaningful if you trust the public key (see BB4)."
      - "Prefer hedged sign over signDeterministic."
      - "ctx <= 255 bytes; use a distinct versioned context per purpose."
  - id: BB2
    name: Encrypt to a public key (KEM-DEM)
    anchor: doc/cookbook/BUILDING_BLOCKS.md#bb2-encrypt-to-a-public-key
    algos: [ml-kem]
    you_supply: [HKDF, AEAD, CSPRNG for nonce]
    caveats:
      - "ML-KEM gives a shared secret, not encryption; you MUST add KDF + AEAD."
      - "Provides confidentiality to the key holder, not sender authentication."
      - "Bind the ciphertext into the KDF/AEAD AAD."
  - id: BB3
    name: Hybrid authenticated handshake
    anchor: doc/cookbook/BUILDING_BLOCKS.md#bb3-hybrid-authenticated-handshake
    algos: [ml-kem, ml-dsa]
    you_supply: [X25519, HKDF, AEAD, replay window, session store]
    caveats:
      - "Authenticate the server key bundle before encapsulation."
      - "Never use the raw shared secret as a traffic key."
      - "Client ML-DSA key is an identity only after enrollment (BB4)."
  - id: BB4
    name: Identity enrollment and key directory
    anchor: doc/cookbook/BUILDING_BLOCKS.md#bb4-identity-enrollment-and-key-directory
    algos: [ml-dsa]
    you_supply: [out-of-band vetting, directory storage, revocation, authority-key custody]
    caveats:
      - "A signed key is an identity only because a trusted authority vouches for it."
      - "Revocation is not provided by signatures; design it explicitly."
  - id: BB5
    name: Deterministic keys from a seed
    anchor: doc/cookbook/BUILDING_BLOCKS.md#bb5-deterministic-keys-from-a-seed
    algos: [ml-kem, ml-dsa]
    you_supply: [secure seed entropy, storage, backup]
    caveats:
      - "The seed equals the secret key; protect it identically."
      - "ML-KEM 64-byte seed keygen is byte-identical to OpenSSL (interop)."
  - id: BB6
    name: Tamper-evident signed log
    anchor: doc/cookbook/BUILDING_BLOCKS.md#bb6-tamper-evident-signed-log
    algos: [ml-dsa]
    you_supply: [public hash, durable storage, optional Merkle tree]
    caveats:
      - "Tamper-evident, not tamper-proof."
      - "Signer-key compromise rewrites history from that point."
      - "Logging people's activity is a surveillance capability; minimize."
  - id: BB7
    name: Signed software and firmware updates
    anchor: doc/cookbook/BUILDING_BLOCKS.md#bb7-signed-software-and-firmware-updates
    algos: [ml-dsa]
    you_supply: [pinned vendor key in image, rollback/version protection, delivery channel]
    caveats:
      - "Sign version + target id with the artifact to stop rollback replay."
      - "Vendor signing key compromise is catastrophic; use an HSM."
  - id: BB8
    name: Encrypted data at rest
    anchor: doc/cookbook/BUILDING_BLOCKS.md#bb8-encrypted-data-at-rest
    algos: [ml-kem]
    you_supply: [HKDF, AEAD, CSPRNG, vault secret-key custody]
    caveats:
      - "Prefer ML-KEM-1024 for long confidentiality lifetimes."
      - "Best-effort zeroization is not hard memory erasure."
  - id: BB9
    name: Hybrid and dual signatures
    anchor: doc/cookbook/BUILDING_BLOCKS.md#bb9-hybrid-and-dual-signatures
    algos: [ml-dsa]
    you_supply: [a classical signature scheme (Ed25519/ECDSA)]
    caveats:
      - "Decide require-both vs accept-either explicitly; opposite failure modes."
      - "A second post-quantum scheme (SLH-DSA) is future work."
  - id: BB10
    name: Offloading heavy work
    anchor: doc/cookbook/BUILDING_BLOCKS.md#bb10-offloading-heavy-work
    algos: [ml-kem, ml-dsa]
    you_supply: [isolate-sendable types, secret-key crossing policy]
    caveats:
      - "Flutter web does not offload isolates; compute() does not move CPU off the main thread."
      - "Passing a secret key to an isolate copies sensitive bytes."

