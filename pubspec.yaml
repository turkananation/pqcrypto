name: pqcrypto
description: Pure Dart post-quantum cryptography library with FIPS 203-aligned ML-KEM and experimental ML-DSA APIs. Flutter and Web compatible.
version: 0.2.1
homepage: https://github.com/turkananation/pqcrypto
repository: https://github.com/turkananation/pqcrypto

environment:
  sdk: ^3.10.0

# No third-party runtime dependencies: pqcrypto is pure Dart and fully
# self-contained. FIPS 202 (SHA-3/SHAKE) is vendored in
# lib/src/common/keccak.dart; the public API depends only on dart:typed_data.

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
