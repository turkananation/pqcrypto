name: openssl_pqcrypto_interop
description: >-
  Developer tool: OpenSSL <-> pqcrypto ML-KEM-512/768/1024 interoperability
  checks via FFI to libcrypto. Not published; depends on the parent package by
  path.
publish_to: none
version: 0.3.0

environment:
  sdk: ^3.10.0

dependencies:
  # Use the in-repo package directly (path dependency on the repo root).
  pqcrypto:
    path: ../..
  ffi: ^2.1.0

dev_dependencies:
  test: ^1.25.6
