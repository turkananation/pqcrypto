name: openssl_pqcrypto_interop
description: >-
  Developer tool: OpenSSL <-> pqcrypto ML-KEM-768 interoperability check via
  FFI to libcrypto. Not published; depends on the parent package by path.
publish_to: none
version: 0.2.0

environment:
  sdk: ^3.10.0

dependencies:
  # Use the in-repo package directly (path dependency on the repo root).
  pqcrypto:
    path: ../..
  ffi: ^2.1.0
