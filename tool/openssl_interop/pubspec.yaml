name: openssl_pqcrypto_interop
description: >-
  Unpublished OpenSSL interoperability harness for pqcrypto ML-KEM, ML-DSA,
  and SLH-DSA via FFI to libcrypto.
publish_to: none
version: 0.4.0-dev

environment:
  sdk: ^3.10.0

dependencies:
  ffi: ^2.1.0
  pqcrypto:
    path: ../..
  pqcrypto_interop_common:
    path: ../interop_common

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
